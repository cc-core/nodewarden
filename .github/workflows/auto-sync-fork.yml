name: Auto sync fork

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时同步一次，时间是 UTC
  workflow_dispatch:         # 可以手动点 Run workflow

permissions:
  contents: write

concurrency:
  group: auto-sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/shuaiplus/nodewarden.git || git remote set-url upstream https://github.com/shuaiplus/nodewarden.git
          git fetch upstream main

          git checkout main
          git merge --no-edit upstream/main
          git push origin main
